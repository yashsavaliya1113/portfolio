name: Weekly blog draft (OpenCode)

# Every Monday an AI agent (OpenCode) drafts one article from automation/blog-topics.md and opens a DRAFT pull request.
# Nothing is published automatically: you review and merge the PR, and the normal deploy workflow does the rest.
# Setup (secrets, variables, repository setting): see docs/automation.md

on:
  schedule:
    - cron: "30 4 * * 1" # Mondays 04:30 UTC (10:00 IST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-blog
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # OpenCode's own provider ("opencode/<model>"). This workflow deliberately does not use Claude/Anthropic models.
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/deepseek-v4-pro' }}
    steps:
      - name: Check the OpenCode key and model
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::Add OPENCODE_API_KEY as a repository secret. See docs/automation.md"
            exit 1
          fi
          case "$OPENCODE_MODEL" in
            opencode/*) ;;
            *) echo "::error::OPENCODE_MODEL must be an OpenCode model like opencode/deepseek-v4-pro (got $OPENCODE_MODEL)"; exit 1 ;;
          esac
          if echo "$OPENCODE_MODEL" | grep -qiE 'claude|anthropic'; then
            echo "::error::Claude/Anthropic models are not allowed in this workflow (got $OPENCODE_MODEL)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install OpenCode
        run: npm install -g ${{ vars.OPENCODE_PACKAGE || '@opencode/cli@2.2.7' }}

      - name: Write the article with OpenCode
        run: |
          TODAY=$(date -u +%F)
          PROMPT="TODAY=$TODAY

          $(sed "s/TODAY/$TODAY/g" automation/prompts/weekly-blog.md)"
          EXTRA=""
          if opencode run --help 2>&1 | grep -q -- "--auto"; then EXTRA="--auto"; fi
          opencode run --model "$OPENCODE_MODEL" $EXTRA "$PROMPT"

      - name: Guard - only the article and the topic list may change
        id: guard
        run: |
          changed=$(git status --porcelain | sed 's/^...//')
          if [ -z "$changed" ]; then echo "::error::OpenCode produced no changes"; exit 1; fi
          bad=$(echo "$changed" | grep -Ev '^(content/blog/[a-z0-9-]+\.mdx|automation/blog-topics\.md)$' || true)
          if [ -n "$bad" ]; then echo "::error::Unexpected files changed:"; echo "$bad"; exit 1; fi
          new=$(git status --porcelain content/blog | grep '^??' | sed 's/^?? content\/blog\///; s/\.mdx$//')
          if [ "$(echo "$new" | wc -l)" -ne 1 ] || [ -z "$new" ]; then echo "::error::Expected exactly one new article, got: $new"; exit 1; fi
          echo "slug=$new" >> "$GITHUB_OUTPUT"
          echo "title=$(node -e "console.log(require('gray-matter')(require('fs').readFileSync('content/blog/$new.mdx','utf8')).data.title)")" >> "$GITHUB_OUTPUT"

      - name: Quality gate for the new article
        run: node scripts/check-blog-post.mjs "${{ steps.guard.outputs.slug }}"

      - name: Build and audit the whole site with the new article
        run: |
          npm run build
          npm run audit

      - name: Open a draft pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            content/blog/
            automation/blog-topics.md
          branch: auto/weekly-blog-${{ steps.guard.outputs.slug }}
          base: main
          draft: true
          commit-message: "content(blog): draft - ${{ steps.guard.outputs.title }}"
          title: "Weekly blog draft: ${{ steps.guard.outputs.title }}"
          body: |
            Drafted by OpenCode (model `${{ vars.OPENCODE_MODEL || 'opencode/deepseek-v4-pro' }}`) from `automation/blog-topics.md`. **Please review before merging.**

            Checks already passed in this run: file guard (only the article and topic list changed), `scripts/check-blog-post.mjs` quality gate, full site build and `npm run audit`.

            Review checklist:
            - [ ] Technically correct (run the code if you can)
            - [ ] No invented facts, numbers or personal claims
            - [ ] Reads like you, and the title and description are what you want searchers to see
            - [ ] Links and references are right

            Merge to publish. Close the PR to discard it (the topic stays ticked in this branch only).
